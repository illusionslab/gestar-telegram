<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GESTAR Signals</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#f5f7fb;font-family:Arial,Helvetica,sans-serif}
    .card{width:min(90vw,560px);padding:36px;border:1px solid #1e334d;border-radius:22px;background:#0b1727;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
    h1{margin:0 0 12px;font-size:34px;letter-spacing:.04em}
    .status{font-size:20px;margin:10px 0 20px}
    .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#31d17c;margin-right:8px;vertical-align:1px}
    p{margin:8px 0;color:#b9c5d3;line-height:1.5}
    code{color:#d9e7ff}
  </style>
</head>
<body>
  <main class="card">
    <h1>GESTAR SIGNALS</h1>
    <div class="status"><span class="dot"></span>ONLINE</div>
    <p>Telegram bridge deployed successfully.</p>
    <p>Signal endpoint: <code>/api/signal</code></p>
  </main>
</body>
</html>
